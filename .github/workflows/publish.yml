# Publishes to npm when a release tag (vX.Y.Z) is pushed, through npm Trusted
# Publishing: no token is stored anywhere. npm accepts the upload only from this
# repository, this workflow file and the `npm` environment. A version that is
# already on npm (the package's first version is published by hand, because npm
# can only trust a workflow for a package that exists) is skipped, not failed.
name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g npm@latest  # Trusted Publishing needs a recent npm
      - run: npm ci
      - run: npm test
      - name: Check the tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in package.json"; exit 1
          fi
      - name: Publish, unless this version is already on npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
          else
            npm publish --provenance
          fi
